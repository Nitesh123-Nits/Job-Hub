name: Update live jobs

# Pulls remote jobs from public APIs into data/jobs.json three times a day (Remotive asks for at most ~4 fetches/day).
on:
  schedule:
    - cron: "17 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch jobs
        run: python3 scripts/fetch_jobs.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update live jobs"; git push; fi
